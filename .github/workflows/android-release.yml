name: Android APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.10'
          arguments: :app:assembleRelease
          build-root-directory: android

      - name: Prepare downloadable APK
        run: cp android/app/build/outputs/apk/release/app-release-unsigned.apk StudyOS-${{ github.ref_name }}.apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: StudyOS-${{ github.ref_name }}.apk
          tag_name: ${{ github.ref_name }}
          name: StudyOS Android ${{ github.ref_name }}
          generate_release_notes: true
